# Install once per clone:  pip install pre-commit && pre-commit install
# Runs automatically on `git commit`; run on demand with:
#   pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: []
        args: [chechen_ocr/]
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (unit tests, golden excluded)
        entry: pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true
