# common_word_fixes.yaml
#
# Conservative, hand-curated whole-word replacements for common OCR
# mistakes not reliably caught by the pattern-based or dictionary-
# candidate correctors (multi-character corruption, or words with
# more than one plausible palochka position).
#
# Extracted from chechen_ocr/correctors/common_words.py (moved here so
# adding a new verified fix is a data change, not a code change).
# Every entry must be a manually verified (before -> after) pair --
# do not add speculative or unverified fixes here.
#
# Format: mapping of raw OCR form -> corrected form.
