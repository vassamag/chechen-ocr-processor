[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chechen-ocr"
dynamic = ["version"]
description = "Chechen OCR post-processing toolkit (Corrector/Pipeline architecture)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.urls]
Repository = "https://github.com/vassamag/chechen-ocr-processor"
Changelog = "https://github.com/vassamag/chechen-ocr-processor/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "chechen_ocr.__version__"}

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3.10", "Pillow>=10.0"]
docx = ["python-docx>=1.0"]
pdf = ["pdf2image>=1.17"]
dev = ["pytest>=8.0", "ruff>=0.15", "mypy>=1.11"]

[project.scripts]
chechen-ocr-text = "chechen_ocr.cli:main_text"
chechen-ocr-image = "chechen_ocr.cli:main_image"
chechen-ocr-apply-review = "chechen_ocr.cli:main_apply_review"
chechen-ocr-batch = "chechen_ocr.cli:main_batch"
chechen-ocr-gui = "chechen_ocr.gui.app:main"

[tool.pytest.ini_options]
markers = [
    "golden: slow regression test against real, non-committed book data (run explicitly with -m golden)",
    "gui: drives the real Tkinter GUI, needs a display (run explicitly with -m gui, e.g. under xvfb-run)",
]
addopts = "-m 'not golden and not gui'"

[tool.setuptools.packages.find]
include = ["chechen_ocr*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/golden/data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports/vars, undefined names -- would have caught the indentation bug class of issue)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modern syntax)
    "B",    # bugbear (common footguns: mutable defaults, broad except, etc.)
    "SIM",  # simplify
]
ignore = [
    "E501",  # line length handled by formatter / not worth failing CI over in this codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False patterns are fine in tests

[tool.mypy]
python_version = "3.10"
packages = ["chechen_ocr"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = ["tests/golden/data"]

[[tool.mypy.overrides]]
# Third-party OCR/vision libs are optional dependencies without
# bundled type stubs; don't fail CI over missing stubs for them.
module = ["pytesseract.*", "PIL.*", "docx.*"]
ignore_missing_imports = true

